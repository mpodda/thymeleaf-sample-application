<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>.</title>
</head>
<body>
	<th:block th:fragment="countries-list">
		<th:block th:insert="~{application/layouts/list-layout :: admin-data-list (title=#{coutries.list.title}, body = ~{::data-list-body})}">
			<th:block th:fragment="data-list-body">
				<section th:insert="~{application/components/table-components :: grid-fragment (gridContent = ~{::gridContent})}">
					<table class="table table-hover" th:fragment="gridContent">
						<thead>
							<tr>
								<th th:replace="~{application/components/table-components :: column-header(text='Name', sortField='name', filter=true)}"></th>
								<th th:replace="~{application/components/table-components :: column-header(text='Continent', sortField='continent.name', filter=true)}"></th>
								<th></th>
							</tr>
						</thead>
						
						<tbody>
							<tr th:each="record : ${countries}">
								<td th:text="${record.name}"></td>
								<td th:text="${record.continent.name}"></td>
								<td><button class="btn btn-light" role="edit-country" th:data-id="${record.id}"><i class="fa-regular fa-pen-to-square"></i></button></td>
							</tr>
						</tbody>
					</table>
				</section>
			</th:block>
		</th:block>
	</th:block>

	<th:block th:fragment="edit-country">
		<section th:replace="~{application/layouts/admin-form-layout :: admin-form-layout(formContent = ~{::form-content}, sessionAttribute = 'countries')}">
			<th:block th:fragment="form-content">
				<div class="row mb-3">
					<th:block th:insert="~{application/components/form-components :: text (label='Name', field='name', name='name')}"></th:block>
				</div>
				<div class="row mb-3">
					<th:block th:insert="~{application/components/form-components :: select (label='Continent', field='continent', name='continent', dataList=${filteredContinents})}"></th:block>
				</div>
			
				<th:block th:insert="~{application/components/form-components :: hidden (field='id')}"></th:block>
			</th:block>
		</section>
	</th:block>	
</body>
</html>
