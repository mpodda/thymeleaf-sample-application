<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>.</title>
</head>
<body>
	<th:block th:fragment="cities-list">
		<th:block th:insert="~{application/layouts/list-layout :: admin-data-list (sessionAttribute = 'cities', ref='city', title=#{cities.list.title}, body = ~{::data-list-body})}">
			<th:block th:fragment="data-list-body">
				<section th:insert="~{application/components/table-components :: grid-fragment (sessionAttribute = 'cities', gridContent = ~{::gridContent})}">
					<table class="table table-hover" th:fragment="gridContent">
						<thead>
							<tr>
								<th th:replace="~{application/components/table-components :: column-header('Name', 'name')}"></th>
								<th th:replace="~{application/components/table-components :: column-header('Country', 'country.name')}"></th>
								<th th:replace="~{application/components/table-components :: column-header('Continent', 'country.continent.name')}"></th>
								<th></th>
							</tr>
						</thead>
						
						<tbody>
							<tr th:each="record : ${cities}">
								<td th:text="${record.name}"></td>
								<td th:text="${record.country.name}"></td>
								<td th:text="${record.country.continent.name}"></td>
								<td><button class="btn btn-light" role="edit-city" th:data-id="${record.id}"><i class="fa-regular fa-pen-to-square"></i></button></td>
							</tr>
						</tbody>
					</table>
				</section>
			</th:block>
		</th:block>
	</th:block>
	
	<th:block th:fragment="edit-city">
		<section th:replace="~{application/layouts/admin-form-layout :: admin-form-layout(object = ${city}, formContent = ~{::form-content}, sessionAttribute = 'cities')}">
			<th:block th:fragment="form-content">
				<div class="row mb-3">
					<th:block th:insert="~{application/components/form-components :: select (label='Continent', name='continent', value=${city.country.continent}, dataList=${filteredContinents})}"></th:block>
				</div>

				<div class="row mb-3">
					<th:block th:insert="~{application/components/form-components :: datalist (label='Country', name='country', value=${city.country}, filterList=${filteredCountries})}"></th:block>
				</div>

				<div class="row mb-3">
					<th:block th:insert="~{application/components/form-components :: text (label='Name', name='name', value=${city.name})}"></th:block>
				</div>

				<th:block th:insert="~{application/components/form-components :: hidden (name='id', value=${city.id})}"></th:block>
			</th:block>
		</section>
	</th:block>
</body>
</html>
