<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>.</title>
</head>
<body>

	<th:block th:fragment="persons-list">
		<th:block th:insert="~{application/layouts/list-layout :: admin-data-list (sessionAttribute = 'persons', ref='person', title=#{persons.list.title}, body = ~{::data-lst-body})}">
			<th:block th:fragment="data-lst-body">
				<section th:insert="~{application/components/table-components :: grid-fragment(sessionAttribute = 'persons', gridContent= ~{::gridContent})}">
					<table class="table table-hover" th:fragment="gridContent">
						<thead>
							<tr>
								<th th:replace="~{application/components/table-components :: column-header('Name', 'name')}"></th>
								<th th:replace="~{application/components/table-components :: column-header('Age','age')}"></th>
								<th th:replace="~{application/components/table-components :: column-header('Date of Birth', 'dateOfBirth')}"></th>
								<th></th>
							</tr>
						</thead>
						
						<tbody>
							<tr th:each="record : ${persons}">
								<td th:text="${record.name}"></td>
								<td th:text="${record.age}"></td>
								<td th:text="${record.dateOfBirth}"></td>
								<td><button class="btn btn-light" role="edit-person" th:data-id="${record.id}"><i class="fa-regular fa-pen-to-square"></i></button></td>
							</tr>
						</tbody>
					</table>
				</section>
			</th:block>
		</th:block>
	</th:block>
	
	<th:block th:fragment="edit-person">
		<section th:replace="~{application/layouts/admin-form-layout :: admin-form-layout(formContent = ~{::form-content}, sessionAttribute = 'persons')}">
			<th:block th:fragment="form-content">
				<div class="row mb-3">
					<th:block th:insert="~{application/components/form-components :: text (label='Name', field='name', name='name')}"></th:block>
				</div>
				
				<div class="row mb-3">
					<th:block th:insert="~{application/components/form-components :: select (label='Continent', name='continent', field='country.continent', dataList=${filteredContinents}, onChangeEvent=@{/} + 'on-continet-value-change', update='country')}"></th:block>
				</div>
				
				<div class="row mb-3">
					<th:block th:insert="~{application/components/form-components :: select (label='Country', name='country', field='country', dataList=${filteredCountries})}"></th:block>
				</div>
				
				<div class="row mb-3">
					<th:block th:insert="~{application/components/form-components :: calendar (label='Date of Birth', name='dateOfBirth', field='dateOfBirth')}"></th:block>
				</div>
				

			</th:block>
		</section>
	</th:block>	
	
</body>
</html>
