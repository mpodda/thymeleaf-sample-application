<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>.</title>
</head>
<body>
	<th:block th:fragment="continents-list">
		<section th:insert="~{application/components/table-components :: grid-fragment (sessionAttribute = 'continents', gridContent= ~{::gridContent})}">
		
			<table class="table table-hover" th:fragment="gridContent">
				<thead>
					<tr>
						<th th:replace="~{application/components/table-components :: column-header('Id', 'id')}"></th>
						<th th:replace="~{application/components/table-components :: column-header('Name', 'name')}"></th>
						<th></th>
					</tr>
				</thead>
				
				<tbody>
					<tr th:each="record : ${continents}">
						<td th:text="${record.id}"></td>
						<td th:text="${record.name}"></td>
						<td><button class="btn btn-light" role="edit-continent" th:data-id="${record.id}"><i class="fa-regular fa-pen-to-square"></i></button></td>
					</tr>
				</tbody>
			</table>
			
		</section>
		
	</th:block>
</body>
</html>
